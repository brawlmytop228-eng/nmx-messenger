<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NMX Messenger</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,Arial;background:#08111f;color:#f8fafc}button,input,textarea{font:inherit}button{cursor:pointer}:root{--p:#101b2d;--p2:#17253b;--line:#293850;--muted:#91a0b8;--blue:#2f6df6;--bubble:#263852}.hide{display:none!important}
#auth{height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:var(--p);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 24px 80px #0007;animation:pop .35s}.logo{width:100px;height:100px;border-radius:28px;object-fit:cover;display:block;margin:auto}.card h1{text-align:center;margin:12px 0 5px}.hint{text-align:center;color:var(--muted);margin-bottom:20px}.tabs{display:flex;gap:5px;background:#0b1424;padding:4px;border-radius:13px;margin-bottom:15px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px}.tabs .on{background:var(--p2);color:#fff}.form{display:grid;gap:9px}.form input,.search,.composer input,.profile input,.profile textarea{background:#0a1424;color:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;outline:0}.primary{border:0;background:var(--blue);color:#fff;border-radius:13px;padding:13px;font-weight:800}.error{color:#fb7185;font-size:13px;min-height:18px}
#app{height:100dvh;display:none;grid-template-columns:310px 1fr}.sidebar{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.head,.chathead{height:64px;flex:none;padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.head img,.me img{width:44px;height:44px;border-radius:14px;object-fit:cover}.brand{font-weight:900;flex:1}.search{margin:10px;width:calc(100% - 20px)}.users{overflow:auto;min-height:0}.user{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:13px;margin:2px 7px;transition:.18s}.user:hover,.user.active{background:var(--p2);transform:translateX(2px)}.user img{width:45px;height:45px;border-radius:50%;object-fit:cover}.uinfo{flex:1;min-width:0}.uname{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small,.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e}.me{margin-top:auto;border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:9px}.me b{flex:1}.icon{border:0;background:transparent;color:#fff;border-radius:11px;padding:8px;font-size:19px}.icon:hover{background:var(--p2)}
.chat{min-width:0;display:flex;flex-direction:column;height:100dvh}.chathead img{width:44px;height:44px;border-radius:50%;object-fit:cover}.chatname{flex:1;min-width:0}.chatname b{display:block}.back{display:none}.messages{flex:1;min-height:0;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 50% 0,#1a2c4755,transparent 55%)}.empty{margin:auto;text-align:center;color:var(--muted)}.empty img{width:82px;height:82px;border-radius:24px;object-fit:cover}.msg{max-width:min(78%,560px);align-self:flex-start;background:var(--bubble);padding:9px 12px;border-radius:16px;animation:slide .16s}.mine{align-self:flex-end;background:var(--blue)}.msg img,.msg video{max-width:100%;max-height:280px;border-radius:11px;display:block}.msg audio{max-width:100%}.file{color:#fff;text-decoration:none}.meta{font-size:10px;opacity:.6;text-align:right;margin-top:4px}.typing{height:20px;flex:none;padding:0 16px;color:var(--muted);font-size:12px}.composer{flex:none;display:flex;gap:7px;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:var(--p);border-top:1px solid var(--line)}.composer input{flex:1;min-width:0}.send,.attach{border:0;border-radius:14px;background:var(--blue);color:#fff;padding:0 15px}.attach{background:var(--p2)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:10;padding:15px}.modalbox{width:min(470px,100%);max-height:90dvh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:22px;padding:20px;animation:pop .2s}.modalhead{display:flex;align-items:center}.modalhead b{flex:1;font-size:20px}.avatarbig{width:90px;height:90px;border-radius:25px;object-fit:cover;display:block;margin:10px auto}.profile{display:grid;gap:9px}.profile textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px}.actions>*{flex:1}.recording{background:#ef4444!important;animation:pulse 1s infinite}.light{filter:invert(.92) hue-rotate(180deg)}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:scale(1.04)}}
@media(max-width:700px){#app{grid-template-columns:1fr}.sidebar.hide{display:none}.chat{display:none}.chat.show{display:flex}.back{display:block}.msg{max-width:88%}}
</style></head><body>
<section id="auth"><div class="card"><img class="logo" src="/bird.jpg"><h1>NMX Messenger</h1><div class="hint">Чаты • фото • видео • файлы • голосовые</div><div class="tabs"><button id="lt" class="on">Вход</button><button id="rt">Регистрация</button></div><form class="form" id="af"><input id="un" maxlength="24" placeholder="Имя пользователя" required><input id="pw" type="password" minlength="4" placeholder="Пароль (минимум 4 символа)" required><button class="primary" id="ab">Войти</button><div class="error" id="err"></div></form></div></section>
<section id="app"><aside class="sidebar" id="side"><div class="head"><img src="/bird.jpg"><b class="brand">NMX Messenger</b><button class="icon" id="theme">☀️</button><button class="icon" id="settings">⚙️</button></div><input class="search" id="search" placeholder="🔎 Поиск людей"><div class="users" id="users"></div><div class="me"><img id="myA" src="/bird.jpg"><b id="myN"></b><button class="icon" id="logout">↪</button></div></aside><main class="chat" id="chat"><header class="chathead"><button class="icon back" id="back">‹</button><img id="ca" src="/bird.jpg"><div class="chatname"><b id="cn">NMX Messenger</b><span class="status" id="cs">Выберите чат</span></div><button class="icon" id="notify">🔔</button></header><div class="messages" id="msgs"><div class="empty"><img src="/bird.jpg"><p>Выберите человека слева.<br>Панель сообщений уже здесь.</p></div></div><div class="typing" id="typing"></div><form class="composer" id="form"><button type="button" class="attach" id="fb">＋</button><input id="file" type="file" hidden accept="image/*,video/*,*/*"><button type="button" class="attach" id="mic">🎙️</button><input id="text" disabled maxlength="4000" placeholder="Сообщение..."><button class="send" disabled id="send">➤</button></form></main></section>
<div class="modal hide" id="modal"><div class="modalbox"><div class="modalhead"><b>Мой профиль</b><button class="icon" id="close">✕</button></div><img class="avatarbig" id="pa" src="/bird.jpg"><div class="profile"><input id="pn" maxlength="24" placeholder="Имя"><textarea id="bio" maxlength="160" placeholder="О себе"></textarea><input id="photo" type="file" accept="image/*"><div class="actions"><button class="primary" id="save">Сохранить</button><button class="icon" id="cancel">Отмена</button></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),s=io();let mode='login',me=null,users=[],online=[],msgs=[],active=null,reply=null,timer,rec,chunks=[];const esc=x=>{let d=document.createElement('div');d.textContent=x;return d.innerHTML},tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),pair=(a,b)=>[a,b].sort().join('|');
function modeSet(m){mode=m;$('lt').classList.toggle('on',m==='login');$('rt').classList.toggle('on',m==='reg');$('ab').textContent=m==='login'?'Войти':'Создать аккаунт'}$('lt').onclick=()=>modeSet('login');$('rt').onclick=()=>modeSet('reg');
$('af').onsubmit=async e=>{e.preventDefault();let body={username:$('un').value,password:$('pw').value};try{let r=await fetch('/api/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('nmx_auth',JSON.stringify(body));start(d.user,d.messages||[])}catch(x){$('err').textContent=x.message}};
async function start(u,old){me=u;msgs=old;socketJoin();$('auth').style.display='none';$('app').style.display='grid';updateMe()}function socketJoin(){s.emit('join',me.username)}let saved=localStorage.getItem('nmx_auth');if(saved)try{let a=JSON.parse(saved);fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json()).then(d=>{if(d.user)start(d.user,d.messages||[])})}catch{}
s.on('init',d=>{me=d.me;users=d.users;msgs=d.messages;online=d.online||[];updateMe();draw()});s.on('presence',p=>{online=p;draw();if(active)$('cs').textContent=online.includes(active)?'🟢 онлайн':'не в сети'});s.on('userList',u=>{users=u;draw()});
function updateMe(){$('myN').textContent=me.username;$('myA').src=me.avatar||'/bird.jpg'}function draw(){let q=$('search').value.toLowerCase();$('users').innerHTML='';users.filter(u=>u.username!==me.username&&u.username.toLowerCase().includes(q)).forEach(u=>{let d=document.createElement('div');d.className='user '+(active===u.username?'active':'');let last=msgs.filter(m=>pair(m.from,m.to)===pair(me.username,u.username)).pop();d.innerHTML=`<img src="${u.avatar||'/bird.jpg'}"><div class=uinfo><div class=uname>${esc(u.username)}</div><div class=small>${last?esc(last.text?.slice(0,35)||'Медиа'):esc(u.bio||'Нет сообщений')}</div></div>${online.includes(u.username)?'<span class=dot></span>':''}`;d.onclick=()=>open(u);$('users').append(d)})}
function open(u){active=u.username;$('cn').textContent=u.username;$('ca').src=u.avatar||'/bird.jpg';$('cs').textContent=online.includes(active)?'🟢 онлайн':'не в сети';$('text').disabled=$('send').disabled=false;$('msgs').innerHTML='';let list=msgs.filter(m=>pair(m.from,m.to)===pair(me.username,active));if(!list.length)$('msgs').innerHTML='<div class=empty><img src="/bird.jpg"><p>Пока сообщений нет.<br>Напиши первым 👋</p></div>';list.forEach(render);$('side').classList.add('hide');$('chat').classList.add('show');$('text').focus();draw()}
function render(m){let d=document.createElement('div');d.className='msg '+(m.from===me.username?'mine':'');d.dataset.id=m.id;let c=m.kind==='image'?`<img src="${m.text}">`:m.kind==='video'?`<video src="${m.text}" controls playsinline></video>`:m.kind==='voice'?`<audio src="${m.text}" controls></audio>`:m.kind==='file'?`<a class=file href="${m.text}" target=_blank download>📎 ${esc(m.name||'Файл')}</a>`:esc(m.text);d.innerHTML=c+`<div class=meta>${tm(m.time)}</div>`;d.onclick=()=>{if(m.from===me.username&&confirm('Удалить сообщение?'))s.emit('deleteMessage',m.id);else{reply=m;$('text').placeholder='Ответить...';$('text').focus()}};$('msgs').append(d);$('msgs').scrollTop=$('msgs').scrollHeight}
s.on('privateMessage',m=>{msgs.push(m);if(active&&pair(m.from,m.to)===pair(me.username,active))render(m);draw()});s.on('messageDeleted',id=>{msgs=msgs.filter(m=>m.id!==id);document.querySelector(`[data-id="${id}"]`)?.remove()});s.on('typing',d=>{if(active===d.from)$('typing').textContent=d.active?d.from+' печатает…':''});
$('form').onsubmit=e=>{e.preventDefault();let t=$('text').value.trim();if(!t||!active)return;s.emit('privateMessage',{to:active,text:t,replyTo:reply?.id||null});$('text').value='';reply=null;$('text').placeholder='Сообщение...'};$('text').oninput=()=>{if(!active)return;s.emit('typing',{to:active,active:true});clearTimeout(timer);timer=setTimeout(()=>s.emit('typing',{to:active,active:false}),700)};$('search').oninput=draw;$('back').onclick=()=>{$('side').classList.remove('hide');$('chat').classList.remove('show');active=null};$('logout').onclick=()=>{localStorage.removeItem('nmx_auth');location.reload()};$('theme').onclick=()=>document.body.classList.toggle('light');$('notify').onclick=()=>Notification?.requestPermission();
$('settings').onclick=()=>{$('modal').classList.remove('hide');$('pn').value=me.username;$('bio').value=me.bio||'';$('pa').src=me.avatar||'/bird.jpg'};$('close').onclick=$('cancel').onclick=()=>$('modal').classList.add('hide');$('photo').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{$('pa').src=r.result;$('pa').dataset.data=r.result};r.readAsDataURL(f)}};$('save').onclick=async()=>{let b={username:me.username,newUsername:$('pn').value,bio:$('bio').value};if($('pa').dataset.data)b.avatar=$('pa').dataset.data;let r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)return alert(d.error);me=d.user;let a=JSON.parse(localStorage.getItem('nmx_auth'));a.username=me.username;localStorage.setItem('nmx_auth',JSON.stringify(a));updateMe();$('modal').classList.add('hide');s.disconnect();s.connect();s.emit('join',me.username)};
$('fb').onclick=()=>active&&$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f||!active)return;if(f.size>12*1024*1024)return alert('Максимум 12 МБ');let r=new FileReader();r.onload=async()=>{let z=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:me.username,name:f.name,data:r.result})}),d=await z.json();if(!z.ok)return alert(d.error);let k=d.type.startsWith('image/')?'image':d.type.startsWith('video/')?'video':'file';s.emit('privateMessage',{to:active,text:d.url,kind:k,name:d.name})};r.readAsDataURL(f);e.target.value=''};
$('mic').onclick=async()=>{if(!active)return;if(rec){rec.stop();$('mic').textContent='🎙️';$('mic').classList.remove('recording');return}try{let st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());let r=new FileReader();r.onload=async()=>{let z=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:me.username,name:'voice.webm',data:r.result})}),d=await z.json();if(z.ok)s.emit('privateMessage',{to:active,text:d.url,kind:'voice'})};r.readAsDataURL(new Blob(chunks,{type:'audio/webm'}))};rec.start();$('mic').textContent='⏹️';$('mic').classList.add('recording')}catch{alert('Разреши доступ к микрофону')}};
</script></body></html>
