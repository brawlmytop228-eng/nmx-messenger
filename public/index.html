<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f14">
<title>NMX Messenger</title>
<link rel="icon" href="/bird.jpg">
<style>
:root{
  --bg:#0a0e13;--panel:#111821;--panel2:#161f2a;--panel3:#1c2733;--line:#202b38;
  --text:#e9f0f8;--muted:#8496ab;--accent:#4d8bf5;--accent2:#7a6cff;--danger:#ef5266;--ok:#22c55e;
  --bubble-in:#1e2835;--bubble-out:linear-gradient(135deg,#4d8bf5,#6a6cff);
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --vh:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
img{max-width:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
input,textarea{outline:none}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a3644;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
a{color:#8ab4ff}

/* AUTH */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:90;overflow:auto;
  background:radial-gradient(1000px 700px at 15% -10%,#1e3a72 0,transparent 55%),radial-gradient(900px 600px at 90% 110%,#3b2a6b 0,transparent 55%),#070a0f}
.auth-card{width:min(440px,100%);background:rgba(17,24,33,.94);border:1px solid var(--line);border-radius:26px;padding:30px 26px;box-shadow:var(--shadow);backdrop-filter:blur(20px);animation:pop .35s ease;margin:auto}
.auth-logo{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:34px;font-weight:900;letter-spacing:-2px;box-shadow:0 15px 40px rgba(77,139,245,.45);color:#fff}
.auth-card h1{text-align:center;margin:0 0 6px;font-size:23px;letter-spacing:-.4px}
.auth-card .sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:13px}
.tabs{display:flex;background:#0c131c;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px;border-radius:11px;color:var(--muted);font-weight:600;transition:.2s}
.tab.active{background:var(--panel3);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea{width:100%;background:#0b1219;border:1px solid var(--line);border-radius:13px;padding:12px 14px;transition:.15s;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,139,245,.15)}
.pw{position:relative}
.pw input{padding-right:44px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;border-radius:9px;color:var(--muted);font-size:16px}
.btn{border-radius:13px;padding:12px 18px;font-weight:700;transition:.15s;border:0}
.btn.primary{background:linear-gradient(135deg,var(--accent),#6a6cff);color:#fff;box-shadow:0 10px 25px rgba(77,139,245,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel3);color:var(--text)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.auth-error{color:#ff8494;font-size:13px;min-height:18px;margin-bottom:10px;text-align:center}

/* SHELL */
#app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100dvh;max-width:1600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden;position:relative}
.sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(180deg,#0d1319 0%,#0a0e13 100%);position:relative;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);height:64px;flex:0 0 64px;padding-top:calc(12px + var(--sat))}
.sb-head .avatar{width:40px;height:40px;border-radius:12px;object-fit:cover;cursor:pointer}
.sb-head .brand{flex:1;font-weight:800;font-size:17px;letter-spacing:-.3px}
.icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text);font-size:17px;transition:.15s}
.icon:hover{background:#ffffff0d}
.icon:active{transform:scale(.94)}
.sb-search{padding:10px 12px}
.sb-search input{width:100%;background:#0b1219;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.sb-search input:focus{border-color:var(--accent)}
.chat-list{flex:1;overflow-y:auto;min-height:0;padding:4px 8px 12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;transition:.14s;position:relative}
.chat-item:hover{background:var(--panel2)}
.chat-item.active{background:linear-gradient(135deg,rgba(77,139,245,.18),rgba(122,108,255,.12))}
.chat-item .avatar{width:50px;height:50px;border-radius:16px;object-fit:cover;flex:0 0 50px}
.chat-item .body{flex:1;min-width:0}
.chat-item .row1{display:flex;align-items:center;gap:6px}
.chat-item .name{font-weight:700;font-size:14.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .time{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.chat-item .preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.chat-item .badge{background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;min-width:20px;text-align:center}
.chat-item .draft{color:#ffb35c;font-style:italic}
.sb-empty{padding:24px;text-align:center;color:var(--muted);font-size:13.5px}
.sb-me{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-bottom:calc(10px + var(--sab));border-top:1px solid var(--line);background:#0e151d}
.sb-me img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.sb-me b{display:block;font-size:13.5px}
.sb-me span{font-size:11.5px;color:var(--muted)}

.empty-state{flex:1;display:grid;place-items:center;text-align:center;padding:30px}
.empty-state .logo{width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;margin:0 auto 16px;box-shadow:0 20px 50px rgba(77,139,245,.35)}
.empty-state h2{margin:0 0 8px;font-size:20px}
.empty-state p{color:var(--muted);max-width:340px;margin:0 auto;font-size:14px;line-height:1.55}

.chat-view{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 16px;height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);background:#0e151dcc;backdrop-filter:blur(14px);z-index:3;padding-top:calc(10px + var(--sat))}
.chat-head .avatar{width:42px;height:42px;border-radius:13px;object-fit:cover;cursor:pointer}
.chat-title{flex:1;min-width:0;cursor:pointer}
.chat-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title span{font-size:12px;color:var(--muted)}
.chat-title span.online{color:var(--ok)}
.back{display:none}

.pinned-banner{background:#12202e;border-bottom:1px solid var(--line);padding:8px 16px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:#a9c8ff}
.pinned-banner span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

.messages{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:14px clamp(12px,4vw,60px);display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:radial-gradient(700px 400px at 80% 0%,rgba(77,139,245,.08),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(122,108,255,.07),transparent 60%)}
.day-sep{align-self:center;background:#0f1720;border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:4px 12px;border-radius:999px;margin:12px 0 6px;font-weight:600}
.unread-sep{align-self:stretch;display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:#ffb35c;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.unread-sep::before,.unread-sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#ffb35c55,transparent)}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:100%;animation:msgIn .18s ease;position:relative}
.msg-row.mine{justify-content:flex-end}
.msg-row .ava{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px;margin-bottom:2px;cursor:pointer}
.msg-row .ava.ghost{visibility:hidden;pointer-events:none}
.bubble{position:relative;max-width:min(72%,620px);padding:9px 13px 7px;border-radius:16px;background:var(--bubble-in);word-break:break-word;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:pre-wrap;line-height:1.4;cursor:pointer;user-select:text}
.msg-row.mine .bubble{background:var(--bubble-out);border-bottom-right-radius:5px}
.msg-row:not(.mine) .bubble{border-bottom-left-radius:5px}
.bubble .author{font-size:12.5px;font-weight:700;color:#8ab4ff;margin-bottom:3px}
.bubble .reply{border-left:3px solid #8ab4ff;padding:4px 8px;margin-bottom:6px;border-radius:6px;background:#0003;font-size:12.5px;opacity:.92}
.bubble .reply b{display:block;color:#a9c8ff;margin-bottom:2px}
.bubble .fwd{font-size:12px;opacity:.85;margin-bottom:4px;font-style:italic}
.bubble .meta{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11px;opacity:.8;margin-top:3px}
.bubble .meta .edited{font-style:italic}
.bubble .checks{font-size:12px}
.bubble .checks.read{color:#7cd4ff}
.msg-media{max-width:100%;border-radius:12px;margin:2px 0 3px;cursor:pointer;display:block}
.msg-media.video{max-height:400px;background:#000}
.file-card{display:flex;align-items:center;gap:10px;background:#0003;border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;margin:2px 0 3px}
.file-card .ico{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:18px;flex:0 0 40px}
.file-card .info{flex:1;min-width:0}
.file-card .info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-card .info span{font-size:11.5px;opacity:.75}
.voice-msg{display:flex;align-items:center;gap:8px;padding:4px 0;min-width:200px}
.voice-msg audio{flex:1;min-width:0;max-width:260px;height:36px}
.voice-speed{background:#ffffff1a;border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;color:#fff;flex:0 0 auto;min-width:34px;text-align:center}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.reactions button{border:1px solid #ffffff1c;background:#ffffff10;border-radius:999px;padding:2px 9px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.reactions button.mine{background:rgba(77,139,245,.35);border-color:rgba(77,139,245,.6)}

.scroll-bottom{position:absolute;right:20px;bottom:110px;width:44px;height:44px;border-radius:50%;background:var(--panel3);border:1px solid var(--line);box-shadow:var(--shadow);display:none;place-items:center;font-size:18px;color:var(--text);z-index:4}
.scroll-bottom.show{display:grid;animation:pop .2s ease}
.scroll-bottom .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center}
.typing-bar{flex:0 0 22px;height:22px;padding:0 22px;font-size:12px;color:var(--muted);display:flex;align-items:center}
.typing-bar .dots span{display:inline-block;width:4px;height:4px;background:var(--muted);border-radius:50%;margin:0 1px;animation:blink 1.4s infinite}
.typing-bar .dots span:nth-child(2){animation-delay:.2s}
.typing-bar .dots span:nth-child(3){animation-delay:.4s}

.composer{display:flex;align-items:flex-end;gap:6px;padding:10px clamp(10px,3vw,44px);padding-bottom:calc(10px + var(--sab));border-top:1px solid var(--line);background:#0e151dcc;backdrop-filter:blur(14px);position:relative}
.composer .btn-round{width:42px;height:42px;border-radius:14px;background:var(--panel3);display:grid;place-items:center;font-size:18px;flex:0 0 42px;transition:.15s}
.composer .btn-round:hover{background:#243040}
.composer .input-wrap{flex:1;background:#0b1219;border:1px solid var(--line);border-radius:16px;display:flex;align-items:flex-end;padding:4px 6px 4px 12px;min-width:0}
.composer textarea{flex:1;background:transparent;border:0;resize:none;padding:8px 4px;max-height:150px;min-height:24px;line-height:1.4;font-size:16px;min-width:0;font-family:inherit}
.composer .send{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--accent),#6a6cff);display:grid;place-items:center;font-size:18px;color:#fff;flex:0 0 44px;box-shadow:0 8px 22px rgba(77,139,245,.4);transition:.15s}
.composer .send:disabled{opacity:.45;box-shadow:none}

.reply-preview{margin:0 clamp(10px,3vw,44px);padding:8px 12px;background:#0f1a26;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;display:none;align-items:center;gap:10px;font-size:13px}
.reply-preview.show{display:flex}
.reply-preview .body{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:10px}
.reply-preview .body b{display:block;color:#8ab4ff;font-size:12.5px}
.reply-preview .body span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.reply-preview .close{color:var(--muted);font-size:20px;padding:0 6px}

.attach-menu{position:absolute;bottom:calc(74px + var(--sab));left:clamp(10px,3vw,44px);display:none;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);z-index:20}
.attach-menu.show{display:grid;animation:pop .15s ease}
.attach-menu button{background:var(--panel3);padding:12px 16px;border-radius:13px;font-size:13.5px;display:flex;align-items:center;gap:8px;font-weight:600}
.attach-menu button:hover{background:#243040}

.recording-bar{position:absolute;bottom:calc(74px + var(--sab));left:clamp(10px,3vw,44px);background:#3a1a22;border:1px solid #6c2b3a;color:#ff98a8;padding:10px 14px;border-radius:14px;display:none;align-items:center;gap:10px;z-index:21}
.recording-bar.show{display:flex}
.dot-rec{width:10px;height:10px;background:#ff5266;border-radius:50%;animation:pulse 1s infinite}

.uploads-stack{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:320px;pointer-events:none}
.upload-item{padding:8px 12px;background:#0f1a26;border:1px solid var(--line);border-radius:12px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:auto}
.upload-item .bar{height:4px;background:#1c2733;border-radius:4px;margin-top:6px;overflow:hidden}
.upload-item .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .15s}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;place-items:center;padding:16px;z-index:90}
.modal.show{display:grid;animation:fade .15s ease}
.card{width:min(520px,100%);max-height:min(85dvh,780px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);animation:pop .2s ease}
.card h3{margin:0 0 14px;font-size:18px}
.card .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.user-pick{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer}
.user-pick:hover{background:var(--panel2)}
.user-pick.checked{background:rgba(77,139,245,.14)}
.user-pick img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.user-pick .u{flex:1;min-width:0}
.user-pick .u b{display:block;font-size:14px}
.user-pick .u span{font-size:12px;color:var(--muted)}
.user-pick .chk{width:22px;height:22px;border-radius:8px;border:2px solid #3a4655;display:grid;place-items:center;font-size:13px;color:transparent}
.user-pick.checked .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.members-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--panel3);border-radius:999px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;font-size:12.5px}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.chip button{color:var(--muted);font-size:14px;padding:0 2px}
.profile-avatar{width:110px;height:110px;border-radius:32px;object-fit:cover;margin:0 auto 14px;display:block;cursor:pointer;box-shadow:0 15px 40px rgba(0,0,0,.4);background:#1c2733}

.emoji-panel{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);animation:pop .2s ease}
.emoji-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.emoji-tabs button{flex:0 0 auto;padding:6px 12px;border-radius:10px;font-size:18px;background:transparent;color:var(--muted)}
.emoji-tabs button.active{background:var(--panel3);color:var(--text)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:320px;overflow-y:auto}
.emoji-grid button{padding:8px 0;font-size:22px;border-radius:10px;transition:.1s}
.emoji-grid button:hover{background:var(--panel3);transform:scale(1.1)}

#contextMenu{position:fixed;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);display:none;min-width:200px;z-index:100;animation:pop .12s ease}
#contextMenu.show{display:block}
#contextMenu .emoji-row{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
#contextMenu .emoji-row button{flex:1;padding:8px 0;font-size:20px;border-radius:10px;transition:.12s}
#contextMenu .emoji-row button:hover{background:var(--panel3);transform:scale(1.15)}
#contextMenu .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--text);width:100%;text-align:left}
#contextMenu .item:hover{background:var(--panel3)}
#contextMenu .item.danger{color:#ff8494}
#contextMenu .item .i{width:18px;text-align:center;font-size:15px}

#toast{position:fixed;bottom:calc(30px + var(--sab));left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel3);border:1px solid var(--line);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:110;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#viewer{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:120;padding:20px;backdrop-filter:blur(6px)}
#viewer.show{display:grid}
#viewer img,#viewer video{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 80px #000}
#viewer .viewer-tools{position:absolute;top:calc(20px + var(--sat));right:20px;display:flex;gap:10px}
#viewer .viewer-tools button{color:#fff;font-size:16px;padding:10px 14px;background:#0008;border-radius:12px;backdrop-filter:blur(10px);font-weight:700}
#viewer .viewer-tools button:hover{background:#000c}

.user-card-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;box-shadow:0 15px 40px rgba(0,0,0,.4)}
.user-card-name{text-align:center;font-size:19px;font-weight:700;margin:0 0 4px}
.user-card-username{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.user-card-bio{background:var(--panel2);border-radius:14px;padding:12px;font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.user-card-status{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.user-card-status .dot{width:8px;height:8px;background:var(--ok);border-radius:50%;box-shadow:0 0 8px var(--ok)}

/* MOBILE */
@media (max-width:760px){
  html,body{position:fixed;width:100%;overflow:hidden}
  #app{display:block;position:fixed;top:0;left:0;right:0;height:var(--vh,100dvh);max-width:none;border:0;overflow:hidden;transition:height .15s ease-out}
  .sidebar{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:1;display:flex;flex-direction:column;background:var(--panel);
    transform:translate3d(0,0,0);transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform}
  .main{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;
    background:#0a0e13;transform:translate3d(100%,0,0);transition:transform .28s cubic-bezier(.4,0,.2,1);
    will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  #app.chat-open .main{transform:translate3d(0,0,0)}
  #app.chat-open .sidebar{transform:translate3d(-30%,0,0)}
  .back{display:grid!important}
  .bubble{max-width:85%}
  .messages{padding:12px 10px}
  .composer{padding:8px 10px calc(8px + var(--sab))}
  .attach-menu,.recording-bar{left:10px}
  .scroll-bottom{right:14px;bottom:calc(110px + var(--sab))}
  .emoji-grid{grid-template-columns:repeat(7,1fr)}
  .sb-head{padding-top:calc(10px + var(--sat));height:auto;flex-basis:56px;min-height:56px}
  .chat-head{height:auto;flex-basis:56px;min-height:56px;padding-top:calc(8px + var(--sat))}
  .uploads-stack{right:10px;bottom:10px;left:10px;max-width:none}
}
@media (min-width:761px){ .back{display:none!important} }

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
const linkify = txt => esc(txt).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const timeStr = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const dayStr = t => {
  const d = new Date(t), n = new Date();
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, n)) return "Сегодня";
  const y = new Date(n); y.setDate(y.getDate() - 1);
  if (same(d, y)) return "Вчера";
  return d.toLocaleDateString([], { day: "numeric", month: "long" });
};
const fmtSize = b => {
  if (b == null) return "";
  const u = ["Б", "КБ", "МБ", "ГБ"]; let i = 0, n = +b || 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + " " + u[i];
};
const relTime = t => {
  if (!t) return "недавно";
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return new Date(t).toLocaleDateString();
};
const toast = (msg, ms = 2000) => {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), ms);
};

/* ------- viewport / keyboard fix ------- */
(function setupViewport() {
  const apply = () => {
    if (!window.visualViewport) return;
    const h = window.visualViewport.height;
    document.documentElement.style.setProperty("--vh", h + "px");
    const kb = (window.innerHeight - h) > 120;
    document.body.classList.toggle("kb-open", kb);
    if (kb && activeChatId) {
      const m = $("messages");
      if (m) requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
    }
  };
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", apply);
    window.visualViewport.addEventListener("scroll", apply);
    window.addEventListener("resize", apply);
    window.addEventListener("orientationchange", () => setTimeout(apply, 200));
    apply();
  }
})();

/* ------- state ------- */
let token = localStorage.getItem("nmx_token");
let socket = null;
let me = null;
let users = [];
let chats = {};
let messagesByChat = {};
let onlineSet = new Set();
let activeChatId = null;
let replyTo = null;
let editingId = null;
let authMode = "login";
let typingTimers = {};
let unreadFrom = {};
let pinnedLocal = JSON.parse(localStorage.getItem("nmx_pinned") || "[]");
let mutedLocal = JSON.parse(localStorage.getItem("nmx_muted") || "[]");
let soundOn = localStorage.getItem("nmx_sound") !== "off";

/* =========================================================
   AUTH
   ========================================================= */
function setAuthMode(mode) {
  authMode = mode;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === mode));
  $("displayNameField").classList.toggle("hidden", mode !== "register");
  $("authSubmit").textContent = mode === "login" ? "Войти" : "Создать аккаунт";
  $("authPassword").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("authError").textContent = "";
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setAuthMode(t.dataset.tab));
$("togglePw").onclick = () => {
  const p = $("authPassword");
  p.type = p.type === "password" ? "text" : "password";
  $("togglePw").textContent = p.type === "password" ? "👁" : "🙈";
};
$("authForm").onsubmit = async e => {
  e.preventDefault();
  const username = $("authUsername").value.trim().toLowerCase();
  const password = $("authPassword").value;
  const displayName = $("authDisplayName").value.trim();
  $("authError").textContent = "";
  $("authSubmit").disabled = true;
  try {
    const url = authMode === "login" ? "/api/login" : "/api/register";
    const body = authMode === "login" ? { username, password } : { username, password, displayName };
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Ошибка");
    token = data.token;
    localStorage.setItem("nmx_token", token);
    startApp();
  } catch (err) { $("authError").textContent = err.message || "Ошибка"; }
  finally { $("authSubmit").disabled = false; }
};
function logout() {
  try { socket && socket.disconnect(); } catch {}
  fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) }).catch(() => {});
  localStorage.removeItem("nmx_token");
  location.reload();
}
$("logoutBtn").onclick = () => { if (confirm("Выйти из аккаунта?")) logout(); };

/* ------- sound ------- */
let audioCtx = null;
function playNotify() {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + .12);
    g.gain.setValueAtTime(.14, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .18);
    o.start(); o.stop(ctx.currentTime + .2);
  } catch {}
}

/* =========================================================
   START
   ========================================================= */
function startApp() {
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  socket = io({ auth: { token } });
  socket.on("connect_error", err => {
    if (err && /unauthorized/.test(err.message)) { localStorage.removeItem("nmx_token"); location.reload(); }
  });

  socket.on("ready", data => {
    me = data.me;
    users = data.users;
    onlineSet = new Set(data.online || []);
    chats = {};
    (data.chats || []).forEach(c => chats[c.id] = c);
    messagesByChat = {};
    renderMe(); renderChats();
  });
  socket.on("userList", list => { users = list; renderMe(); if (activeChatId) renderChatHeader(); });
  socket.on("presence", list => {
    onlineSet = new Set(list);
    users = users.map(u => ({ ...u, online: onlineSet.has(u.username) }));
    renderChats(); if (activeChatId) renderChatHeader();
  });
  socket.on("chatNew", c => { chats[c.id] = c; renderChats(); openChat(c.id); });
  socket.on("chatUpdate", c => { chats[c.id] = c; renderChats(); if (activeChatId === c.id) { renderChatHeader(); renderPinnedBanner(); } });
  socket.on("chatRemoved", id => { delete chats[id]; delete messagesByChat[id]; if (activeChatId === id) closeChat(); renderChats(); });
  socket.on("chatRead", ({ chatId, username, time }) => {
    const c = chats[chatId]; if (!c) return;
    c.reads = c.reads || {}; c.reads[username] = time;
    if (chatId === activeChatId) renderMessages();
  });
  socket.on("chatMessages", ({ chatId, messages }) => {
    messagesByChat[chatId] = messages;
    if (chatId === activeChatId) { renderMessages(); renderPinnedBanner(); }
  });
  socket.on("message", m => {
    if (!messagesByChat[m.chatId]) messagesByChat[m.chatId] = [];
    messagesByChat[m.chatId].push(m);
    if (activeChatId === m.chatId) {
      appendOrRender(m);
      if (m.from !== me.username) socket.emit("markRead", m.chatId);
    } else if (m.from !== me.username) {
      const c = chats[m.chatId];
      if (!mutedLocal.includes(m.chatId)) playNotify();
      if ("Notification" in window && Notification.permission === "granted") {
        try { new Notification(c ? c.name : "NMX", { body: m.type === "text" ? m.text : "Медиа", icon: c?.avatar, tag: m.chatId }); } catch {}
      }
    }
  });
  socket.on("messageEdited", m => {
    const list = messagesByChat[m.chatId]; if (!list) return;
    const i = list.findIndex(x => x.id === m.id); if (i >= 0) list[i] = m;
    if (activeChatId === m.chatId) renderMessages();
  });
  socket.on("messageDeleted", ({ chatId, id }) => {
    const list = messagesByChat[chatId]; if (!list) return;
    const i = list.findIndex(x => x.id === id); if (i >= 0) list.splice(i, 1);
    if (activeChatId === chatId) { renderMessages(); renderPinnedBanner(); }
  });
  socket.on("messageReaction", ({ id, chatId, reactions }) => {
    const list = messagesByChat[chatId]; if (!list) return;
    const m = list.find(x => x.id === id);
    if (m) { m.reactions = reactions; if (activeChatId === chatId) renderMessages(); }
  });
  socket.on("typing", ({ chatId, from, active }) => {
    if (chatId !== activeChatId) return;
    if (active) typingTimers[from] = Date.now(); else delete typingTimers[from];
    updateTypingBar();
  });
  socket.on("profileUpdated", u => { me = u; renderMe(); });
  socket.on("errorMessage", msg => toast(msg));

  socket.on("call:invite", async ({ from, kind }) => {
    if (!confirm(`Входящий ${kind === "video" ? "видео" : "аудио"} звонок от ${from}. Принять?`)) {
      socket.emit("call:decline", { to: from }); return;
    }
    socket.emit("call:accept", { to: from });
  });

  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
}

function renderMe() {
  if (!me) return;
  $("myAvatar").src = me.avatar || "/bird.jpg";
  $("meAvatar2").src = me.avatar || "/bird.jpg";
  $("meName").textContent = me.displayName || me.username;
  $("meStatus").textContent = "@" + me.username;
}

/* =========================================================
   CHAT LIST
   ========================================================= */
function getDraft(id) { return localStorage.getItem("nmx_draft_" + id) || ""; }
function saveDraft(id, v) {
  if (!id) return;
  if (v && v.trim()) localStorage.setItem("nmx_draft_" + id, v);
  else localStorage.removeItem("nmx_draft_" + id);
}
function renderChats() {
  const q = ($("search").value || "").toLowerCase().trim();
  const arr = Object.values(chats).filter(c => {
    if (!q) return true;
    if ((c.name || "").toLowerCase().includes(q)) return true;
    return (c.members || []).some(m => (m.displayName || "").toLowerCase().includes(q) || m.username.includes(q));
  }).sort((a, b) => {
    const ap = pinnedLocal.includes(a.id) ? 1 : 0;
    const bp = pinnedLocal.includes(b.id) ? 1 : 0;
    if (ap !== bp) return bp - ap;
    const ta = a.lastMessage ? a.lastMessage.time : a.createdAt || 0;
    const tb = b.lastMessage ? b.lastMessage.time : b.createdAt || 0;
    return tb - ta;
  });
  const el = $("chatList");
  el.innerHTML = "";
  if (!arr.length) { el.innerHTML = '<div class="sb-empty">Пока нет чатов.<br>Нажмите ✏️ чтобы начать.</div>'; return; }
  for (const c of arr) {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === activeChatId ? " active" : "");
    const other = c.type === "private" ? (c.members || []).find(m => m.username !== me.username) : null;
    const otherOnline = other && onlineSet.has(other.username);
    const pinned = pinnedLocal.includes(c.id);
    const muted = mutedLocal.includes(c.id);
    const draft = getDraft(c.id);
    const last = c.lastMessage;
    let preview = "Нет сообщений", draftFlag = "";
    if (draft) {
      preview = draft; draftFlag = '<span class="draft">Черновик:</span> ';
    } else if (last) {
      const who = last.from === me.username ? "Вы: " : (c.type === "group" ? last.from + ": " : "");
      preview = who + last.text;
    }
    const t = last ? timeStr(last.time) : "";
    const unread = !muted && c.unread > 0 ? `<span class="badge">${c.unread > 99 ? "99+" : c.unread}</span>` : "";
    const flags = [pinned ? "📌" : "", muted ? "🔇" : ""].filter(Boolean).join(" ");
    item.innerHTML = `
      <div style="position:relative;flex:0 0 50px">
        <img class="avatar" src="${esc(c.avatar || "/bird.jpg")}" alt="">
        ${otherOnline ? '<span style="position:absolute;right:0;bottom:0;width:13px;height:13px;background:#22c55e;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 8px #22c55e"></span>' : ""}
      </div>
      <div class="body">
        <div class="row1">
          <div class="name">${c.type === "group" ? "👥 " : ""}${esc(c.name)}${flags ? ' <span class="muted" style="font-size:11px">' + flags + "</span>" : ""}</div>
          <div class="time">${t}</div>
        </div>
        <div class="preview">${draftFlag}${esc(preview)}</div>
      </div>
      ${unread}`;
    item.onclick = () => openChat(c.id);
    let pressT = null;
    item.addEventListener("pointerdown", e => {
      pressT = setTimeout(() => { if (navigator.vibrate) navigator.vibrate(15); showChatMenu(c, e.clientX, e.clientY); }, 500);
    });
    item.addEventListener("pointerup", () => clearTimeout(pressT));
    item.addEventListener("pointercancel", () => clearTimeout(pressT));
    item.addEventListener("pointermove", () => clearTimeout(pressT));
    item.oncontextmenu = e => { e.preventDefault(); showChatMenu(c, e.clientX, e.clientY); };
    el.appendChild(item);
  }
}
$("search").oninput = renderChats;

function showChatMenu(c, x, y) {
  const menu = $("contextMenu");
  menu.innerHTML = "";
  const items = [];
  items.push({
    icon: pinnedLocal.includes(c.id) ? "📌" : "📍",
    label: pinnedLocal.includes(c.id) ? "Открепить" : "Закрепить",
    fn: () => {
      pinnedLocal = pinnedLocal.includes(c.id) ? pinnedLocal.filter(x => x !== c.id) : [...pinnedLocal, c.id];
      localStorage.setItem("nmx_pinned", JSON.stringify(pinnedLocal)); renderChats();
    }
  });
  items.push({
    icon: "🔇",
    label: mutedLocal.includes(c.id) ? "Включить звук" : "Выключить звук",
    fn: () => {
      mutedLocal = mutedLocal.includes(c.id) ? mutedLocal.filter(x => x !== c.id) : [...mutedLocal, c.id];
      localStorage.setItem("nmx_muted", JSON.stringify(mutedLocal)); renderChats();
    }
  });
  if (c.unread > 0) items.push({ icon: "✓", label: "Отметить прочитанным", fn: () => socket.emit("markRead", c.id) });
  if (c.type === "group") items.push({ icon: "🚪", label: "Покинуть", danger: true, fn: () => { if (confirm("Покинуть?")) socket.emit("leaveChat", c.id); } });

  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "item" + (it.danger ? " danger" : "");
    b.innerHTML = `<span class="i">${it.icon}</span><span>${esc(it.label)}</span>`;
    b.onclick = () => { menu.classList.remove("show"); it.fn(); };
    menu.appendChild(b);
  });
  openMenuAt(menu, x, y);
}
function openMenuAt(menu, x, y) {
  menu.classList.add("show");
  const r = menu.getBoundingClientRect();
  const maxX = window.innerWidth - r.width - 8;
  const maxY = window.innerHeight - r.height - 8;
  menu.style.left = Math.max(8, Math.min(x, maxX)) + "px";
  menu.style.top = Math.max(8, Math.min(y, maxY)) + "px";
}
function closeMenu() { $("contextMenu").classList.remove("show"); }
document.addEventListener("click", e => { if (!e.target.closest("#contextMenu")) closeMenu(); });
document.addEventListener("scroll", closeMenu, true);

/* =========================================================
   OPEN / CLOSE CHAT
   ========================================================= */
function openChat(id) {
  const c = chats[id]; if (!c) return;
  if (activeChatId && activeChatId !== id) saveDraft(activeChatId, textInput.value);
  activeChatId = id;
  replyTo = null; editingId = null; hideReplyPreview();
  unreadFrom[id] = (c.reads && me && c.reads[me.username]) || 0;
  $("emptyState").classList.add("hidden");
  $("chatView").classList.remove("hidden");
  $("app").classList.add("chat-open");
  renderChatHeader(); renderPinnedBanner(); renderChats();
  if (!messagesByChat[id]) {
    messagesByChat[id] = [];
    socket.emit("loadMessages", id);
    $("messages").innerHTML = '<div class="day-sep">Загрузка…</div>';
  } else renderMessages();
  socket.emit("markRead", id);
  const draft = getDraft(id);
  textInput.value = draft;
  autoGrow(); updateSendBtn();
  requestAnimationFrame(() => textInput.focus({ preventScroll: true }));
}
function closeChat() {
  if (activeChatId) saveDraft(activeChatId, textInput.value);
  activeChatId = null;
  $("chatView").classList.add("hidden");
  $("emptyState").classList.remove("hidden");
  $("app").classList.remove("chat-open");
  if (document.activeElement === textInput) textInput.blur();
  renderChats();
}
$("backBtn").onclick = closeChat;

function renderChatHeader() {
  const c = chats[activeChatId]; if (!c) return;
  $("chatAvatar").src = c.avatar || "/bird.jpg";
  $("chatName").textContent = c.name;
  let status = "";
  if (c.type === "private") {
    const other = (c.members || []).find(m => m.username !== me.username);
    if (other) status = onlineSet.has(other.username) ? "в сети" : (other.lastSeen ? "был(а) " + relTime(other.lastSeen) : "не в сети");
  } else status = (c.members || []).length + " участников";
  const st = $("chatStatus");
  st.textContent = status;
  st.className = status === "в сети" ? "online" : "";
}
$("chatTitleBtn").onclick = () => $("infoBtn").click();
$("chatAvatar").onclick = () => $("infoBtn").click();

function renderPinnedBanner() {
  const c = chats[activeChatId]; if (!c) return;
  const pinned = c.pinned || [];
  const banner = $("pinnedBanner");
  if (!pinned.length) { banner.classList.add("hidden"); return; }
  const list = messagesByChat[activeChatId] || [];
  const m = pinned.slice().reverse().map(id => list.find(x => x.id === id)).find(Boolean);
  if (!m) { banner.classList.add("hidden"); return; }
  banner.classList.remove("hidden");
  const txt = m.type === "text" ? m.text : ({ image: "📷 Фото", video: "🎥 Видео", audio: "🎙️ Голосовое", file: "📎 " + (m.name || "Файл") }[m.type] || "Медиа");
  $("pinnedText").textContent = "📌 " + m.from + ": " + String(txt).slice(0, 80);
  $("pinnedText").onclick = () => { const el = document.querySelector(`[data-id="${m.id}"]`); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); };
}
$("unpinBtn").onclick = () => {
  const c = chats[activeChatId]; if (!c) return;
  (c.pinned || []).forEach(id => socket.emit("pinMessage", { chatId: c.id, messageId: id }));
};

/* =========================================================
   RENDER MESSAGES
   ========================================================= */
function renderMessages() {
  const box = $("messages");
  const list = messagesByChat[activeChatId] || [];
  box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<div class="day-sep">Пока нет сообщений — напишите первым 👋</div>'; return; }
  const chat = chats[activeChatId];
  const unreadTime = unreadFrom[activeChatId] || 0;
  let unreadInserted = false;
  let lastDay = null, lastAuthor = null, lastTime = 0;
  for (const m of list) {
    const d = dayStr(m.time);
    if (d !== lastDay) {
      const sep = document.createElement("div");
      sep.className = "day-sep"; sep.textContent = d;
      box.appendChild(sep);
      lastDay = d; lastAuthor = null;
    }
    if (!unreadInserted && unreadTime > 0 && m.time > unreadTime && m.from !== me.username) {
      const sep = document.createElement("div");
      sep.className = "unread-sep"; sep.textContent = "Новые сообщения";
      box.appendChild(sep);
      unreadInserted = true;
    }
    const showAva = chat && chat.type === "group" && (lastAuthor !== m.from || m.time - lastTime > 5 * 60 * 1000);
    box.appendChild(buildMessage(m, showAva));
    lastAuthor = m.from; lastTime = m.time;
  }
  box.scrollTop = box.scrollHeight;
  updateScrollButton();
}

function buildMessage(m, showAva) {
  const chat = chats[m.chatId] || {};
  const mine = m.from === me.username;
  const wrap = document.createElement("div");
  wrap.className = "msg-row" + (mine ? " mine" : "");
  wrap.dataset.id = m.id;

  if (chat.type === "group" && !mine) {
    const ava = document.createElement("img");
    ava.className = "ava" + (showAva ? "" : " ghost");
    const u = users.find(x => x.username === m.from);
    ava.src = (u && u.avatar) || "/bird.jpg";
    ava.onclick = () => showUserProfile(m.from);
    wrap.appendChild(ava);
  } else if (chat.type === "group" && mine) {
    const sp = document.createElement("div");
    sp.className = "ava ghost";
    wrap.appendChild(sp);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  let html = "";
  if (m.forwarded) html += '<div class="fwd">↪ Переслано</div>';
  if (chat.type === "group" && !mine) {
    const u = users.find(x => x.username === m.from);
    html += `<div class="author">${esc(u ? (u.displayName || u.username) : m.from)}</div>`;
  }
  if (m.replyTo) {
    const ref = (messagesByChat[m.chatId] || []).find(x => x.id === m.replyTo);
    if (ref) {
      const who = ref.from === me.username ? "Вы" : ref.from;
      const txt = ref.type === "text" ? ref.text : ({ image: "📷 Фото", video: "🎥 Видео", audio: "🎙️ Голосовое", file: "📎 " + (ref.name || "Файл") }[ref.type] || "Медиа");
      html += `<div class="reply"><b>${esc(who)}</b>${esc(String(txt).slice(0, 120))}</div>`;
    }
  }

  if (m.type === "image") {
    html += `<img class="msg-media" src="${esc(m.url)}" alt="Фото" loading="lazy">`;
    if (m.text) html += `<div>${linkify(m.text)}</div>`;
  } else if (m.type === "video") {
    html += `<video class="msg-media video" src="${esc(m.url)}" controls preload="metadata" playsinline></video>`;
    if (m.text) html += `<div>${linkify(m.text)}</div>`;
  } else if (m.type === "audio") {
    html += `<div class="voice-msg"><audio controls preload="metadata" src="${esc(m.url)}"></audio><button class="voice-speed" type="button" data-speed="1">1×</button></div>`;
  } else if (m.type === "file") {
    html += `<a class="file-card" href="${esc(m.url)}" download="${esc(m.name || "file")}" target="_blank" rel="noopener">
      <div class="ico">📎</div>
      <div class="info"><b>${esc(m.name || "Файл")}</b><span>${fmtSize(m.size)}</span></div>
    </a>`;
  } else {
    html += `<div>${linkify(m.text)}</div>`;
  }

  const chatReads = (chat.reads || {});
  const others = (chat.members || []).filter(x => x.username !== me.username).map(x => x.username);
  const readByAll = mine && others.length > 0 && others.every(u => (chatReads[u] || 0) >= m.time);
  const checks = mine ? `<span class="checks${readByAll ? " read" : ""}">${readByAll ? "✓✓" : "✓"}</span>` : "";

  const reactHtml = m.reactions && Object.keys(m.reactions).length
    ? `<div class="reactions">${Object.entries(m.reactions).map(([e, l]) =>
        `<button class="${l.includes(me.username) ? "mine" : ""}" data-react="${esc(e)}">${esc(e)} <span>${l.length}</span></button>`).join("")}</div>`
    : "";

  html += `<div class="meta">${m.edited ? '<span class="edited">изм.</span>' : ""}${timeStr(m.time)}${checks}</div>`;
  html += reactHtml;
  bubble.innerHTML = html;

  // speed buttons for voice messages
  bubble.querySelectorAll(".voice-speed").forEach(btn => {
    const audio = btn.parentElement.querySelector("audio");
    btn.onclick = e => {
      e.stopPropagation();
      const cur = parseFloat(btn.dataset.speed) || 1;
      const next = cur === 1 ? 1.5 : cur === 1.5 ? 2 : 1;
      btn.dataset.speed = next;
      btn.textContent = next + "×";
      try { audio.playbackRate = next; } catch {}
    };
  });

  // long press + right click
  let pressTimer = null, moved = false;
  bubble.addEventListener("pointerdown", e => {
    moved = false;
    pressTimer = setTimeout(() => {
      if (!moved) { if (navigator.vibrate) navigator.vibrate(15); showMessageMenu(m, e.clientX, e.clientY); }
    }, 500);
  });
  bubble.addEventListener("pointermove", () => { moved = true; clearTimeout(pressTimer); });
  bubble.addEventListener("pointerup", () => clearTimeout(pressTimer));
  bubble.addEventListener("pointercancel", () => clearTimeout(pressTimer));
  bubble.addEventListener("contextmenu", e => { e.preventDefault(); showMessageMenu(m, e.clientX, e.clientY); });
  bubble.addEventListener("click", e => {
    const rb = e.target.closest("[data-react]");
    if (rb) { e.stopPropagation(); socket.emit("reaction", { messageId: m.id, emoji: rb.dataset.react }); return; }
    if (e.target.closest("a,audio,video,img,button")) return;
  });

  wrap.appendChild(bubble);
  return wrap;
}

function showMessageMenu(m, x, y) {
  const menu = $("contextMenu");
  menu.innerHTML = "";
  const mine = m.from === me.username;
  const emo = document.createElement("div");
  emo.className = "emoji-row";
  ["❤️","👍","😂","🔥","😮","😢"].forEach(e => {
    const b = document.createElement("button");
    b.textContent = e;
    b.onclick = ev => { ev.stopPropagation(); socket.emit("reaction", { messageId: m.id, emoji: e }); closeMenu(); };
    emo.appendChild(b);
  });
  menu.appendChild(emo);

  const items = [
    { icon: "↩", label: "Ответить", fn: () => setReply(m) },
    { icon: "📋", label: "Копировать", fn: () => {
        const t = m.type === "text" ? m.text : m.url || "";
        navigator.clipboard?.writeText(t).then(() => toast("Скопировано")).catch(() => {});
      } },
    { icon: "↪", label: "Переслать", fn: () => showForward(m) },
    { icon: "📌", label: "Закрепить", fn: () => socket.emit("pinMessage", { chatId: m.chatId, messageId: m.id }) }
  ];
  if (mine && m.type === "text") items.push({ icon: "✎", label: "Изменить", fn: () => startEdit(m) });
  if (mine) items.push({ icon: "🗑", label: "Удалить", danger: true, fn: () => { if (confirm("Удалить сообщение?")) socket.emit("deleteMessage", m.id); } });
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "item" + (it.danger ? " danger" : "");
    b.innerHTML = `<span class="i">${it.icon}</span><span>${esc(it.label)}</span>`;
    b.onclick = ev => { ev.stopPropagation(); closeMenu(); it.fn(); };
    menu.appendChild(b);
  });
  openMenuAt(menu, x, y);
}

function appendOrRender(m) {
  const box = $("messages");
  const chat = chats[m.chatId];
  const list = messagesByChat[m.chatId] || [];
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
  const isNewDay = list.length > 1 && dayStr(list[list.length - 2].time) !== dayStr(m.time);
  const prev = list[list.length - 2];
  const showAva = chat && chat.type === "group" && (!prev || prev.from !== m.from || m.time - prev.time > 5 * 60 * 1000);
  if (isNewDay) {
    const sep = document.createElement("div");
    sep.className = "day-sep"; sep.textContent = dayStr(m.time);
    box.appendChild(sep);
  }
  box.appendChild(buildMessage(m, showAva));
  if (near || m.from === me.username) box.scrollTop = box.scrollHeight;
  updateScrollButton();
}

function updateScrollButton() {
  const box = $("messages"); if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
  $("scrollBottom").classList.toggle("show", !near);
}
$("messages").addEventListener("scroll", updateScrollButton);
$("scrollBottom").onclick = () => {
  const box = $("messages");
  box.scrollTo({ top: box.scrollHeight, behavior: "smooth" });
};

let typingSent = false, typingStopTimer = null;
function updateTypingBar() {

/* =========================================================
   COMPOSER
   ========================================================= */
const textInput = $("textInput");
function autoGrow() { textInput.style.height = "auto"; textInput.style.height = Math.min(textInput.scrollHeight, 150) + "px"; }
function updateSendBtn() { $("sendBtn").disabled = !textInput.value.trim() || !activeChatId; }
let draftTimer = null;
textInput.addEventListener("input", () => {
  autoGrow(); updateSendBtn();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { if (activeChatId) saveDraft(activeChatId, textInput.value); renderChats(); }, 400);
  if (!activeChatId) return;
  if (!typingSent) { socket.emit("typing", { chatId: activeChatId, active: true }); typingSent = true; }
  clearTimeout(typingStopTimer);
  typingStopTimer = setTimeout(() => { typingSent = false; socket.emit("typing", { chatId: activeChatId, active: false }); }, 1200);
});
textInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").dispatchEvent(new Event("submit", { cancelable: true })); }
});
$("composer").onsubmit = e => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!activeChatId) return;
  if (editingId) {
    socket.emit("editMessage", { id: editingId, text });
    editingId = null; textInput.value = ""; autoGrow(); updateSendBtn();
    saveDraft(activeChatId, ""); renderChats();
    return;
  }
  if (!text) return;
  socket.emit("sendMessage", { chatId: activeChatId, text, replyTo: replyTo ? replyTo.id : null });
  textInput.value = ""; autoGrow(); updateSendBtn();
  saveDraft(activeChatId, ""); renderChats();
  replyTo = null; hideReplyPreview();
  typingSent = false;
  socket.emit("typing", { chatId: activeChatId, active: false });
};

function setReply(m) {
  replyTo = m; editingId = null;
  const who = m.from === me.username ? "себе" : (users.find(u => u.username === m.from)?.displayName || m.from);
  $("replyName").textContent = "Ответ " + who;
  const txt = m.type === "text" ? m.text : ({ image: "📷 Фото", video: "🎥 Видео", audio: "🎙️ Голосовое", file: "📎 " + (m.name || "Файл") }[m.type] || "Медиа");
  $("replyText").textContent = String(txt).slice(0, 120);
  $("replyPreview").classList.add("show");
  $("textInput").placeholder = "Ответ…";
  $("textInput").focus();
}
function hideReplyPreview() {
  $("replyPreview").classList.remove("show");
  $("textInput").placeholder = "Написать сообщение…";
}
$("cancelReply").onclick = () => { replyTo = null; editingId = null; hideReplyPreview(); textInput.value = ""; autoGrow(); updateSendBtn(); };
function startEdit(m) {
  editingId = m.id; textInput.value = m.text || "";
  autoGrow(); updateSendBtn();
  $("replyName").textContent = "Редактирование";
  $("replyText").textContent = String(m.text || "").slice(0, 120);
  $("replyPreview").classList.add("show");
  $("textInput").placeholder = "Изменить…";
  $("textInput").focus();
}

function openEmojiPicker() {

  function fill(k) {
    grid.innerHTML = "";

      const b = document.createElement("button");
      b.type = "button"; b.textContent = e;
      b.onclick = () => { textInput.value += e; autoGrow(); updateSendBtn(); textInput.focus(); };

  });

}

function uploadAndSend(file) {
  if (!activeChatId) return;
  const chatId = activeChatId;
  const row = document.createElement("div");
  row.className = "upload-item";
  row.innerHTML = `<div>📤 <b>${esc(file.name)}</b> — <span class="pct">0%</span> <span class="muted">(${fmtSize(file.size)})</span></div><div class="bar"><i></i></div>`;
  $("uploadsStack").appendChild(row);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload?token=" + encodeURIComponent(token));
  xhr.setRequestHeader("X-File-Name", encodeURIComponent(file.name));
  xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
  xhr.upload.onprogress = e => {
    const pct = e.lengthComputable ? Math.round(e.loaded / e.total * 100) : 0;
    row.querySelector(".pct").textContent = pct + "%";
    row.querySelector(".bar > i").style.width = pct + "%";
  };
  xhr.onload = () => {
    row.remove();
    let res = null; try { res = JSON.parse(xhr.responseText); } catch {}
    if (!res || !res.url) { toast("Ошибка загрузки"); return; }
    let type = "file";
    const t = (file.type || "").toLowerCase();
    if (t.startsWith("image/")) type = "image";
    else if (t.startsWith("video/")) type = "video";
    else if (t.startsWith("audio/")) type = "audio";
    else if (/\.(m4a|mp3|ogg|oga|opus|wav|aac)$/i.test(file.name)) type = "audio";
    socket.emit("sendMedia", {
      chatId, url: res.url, type, name: res.name, size: res.size, mime: res.type,
      replyTo: replyTo ? replyTo.id : null
    });
    replyTo = null; hideReplyPreview();
  };
  xhr.onerror = () => { row.remove(); toast("Ошибка сети"); };
  xhr.send(file);
}

/* ------- voice recording ------- */
let recorder = null, recStream = null, recChunks = [], recStart = 0, recTimer = null;
async function startRecording() {
  if (!activeChatId) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    toast("Нужен HTTPS и современный браузер"); return;
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const mimes = [
      "audio/mp4;codecs=mp4a.40.2",
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/ogg"
    ];
    const mime = mimes.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || "";
    recorder = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
    recChunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => {
      if (recStream) recStream.getTracks().forEach(t => t.stop());
      recStream = null;
      $("recordingBar").classList.remove("show");
      clearInterval(recTimer);
      if (!recChunks.length) { recorder = null; return; }
      const mt = recorder.mimeType || "audio/webm";
      const ext = mt.includes("mp4") ? "m4a" : mt.includes("ogg") ? "ogg" : "webm";
      const blob = new Blob(recChunks, { type: mt });
      const f = new File([blob], "voice-" + Date.now() + "." + ext, { type: mt });
      recorder = null; recChunks = [];
      uploadAndSend(f);
    };
    recorder.start(250);
    recStart = Date.now();
    $("recordingBar").classList.add("show");
    $("recTime").textContent = "0:00";
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      $("recTime").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }, 250);
  } catch (e) {
    toast(e.name === "NotAllowedError" ? "Разрешите доступ к микрофону" : "Не удалось включить микрофон");
  }
}
$("micBtn").onclick = startRecording;
$("stopRec").onclick = () => { try { recorder && recorder.state !== "inactive" && recorder.stop(); } catch {} };
$("cancelRec").onclick = () => { recChunks = []; try { recorder && recorder.state !== "inactive" && recorder.stop(); } catch {} };

  if (newChatMode === "add") {
    const c = chats[activeChatId]; if (!c) return;
    if (!selectedMembers.size) { toast("Выберите участников"); return; }
    socket.emit("addMembers", { chatId: c.id, members: [...selectedMembers] });
    $("newChatModal").classList.remove("show");
    return;
  }
  const name = $("newGroupName").value.trim();
  const members = [...selectedMembers];
  if (!members.length) { toast("Выберите участника"); return; }
  if (members.length > 1 && !name) {
    const auto = members.slice(0, 2).map(u => users.find(x => x.username === u)?.displayName || u).join(", ") + (members.length > 2 ? ` +${members.length - 2}` : "");
    socket.emit("createChat", { members, name: auto });
  } else socket.emit("createChat", { members, name });
  $("newChatModal").classList.remove("show");
};

/* ------- resize image for avatar ------- */
function resizeImage(file, maxSize = 512, quality = 0.85) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) { reject(new Error("not image")); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#0a0e13";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", quality));
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error("decode"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("read"));
    reader.readAsDataURL(file);
  });
}

  }
};
$("saveProfileBtn").onclick = () => {
  const p = { displayName: $("profileDisplayName").value, bio: $("profileBio").value };
  const av = $("profileAvatar").dataset.data;
  if (av) p.avatar = av;
  socket.emit("profileUpdate", p);
  $("profileModal").classList.remove("show");
  toast("Профиль сохранён");
};

/* ------- user profile ------- */
function showUserProfile(username) {
  const u = users.find(x => x.username === username);
  if (!u) return;
  $("userCardAvatar").src = u.avatar || "/bird.jpg";
  $("userCardName").textContent = u.displayName || u.username;
  $("userCardUsername").textContent = "@" + u.username;
  const status = u.online ? '<span class="dot"></span> в сети' : (u.lastSeen ? "был(а) " + relTime(u.lastSeen) : "не в сети");
  $("userCardStatus").innerHTML = status;
  $("userCardBio").textContent = u.bio || "—";
  $("userCardBio").style.display = u.bio ? "block" : "none";
  $("userCardMsg").onclick = () => {
    $("userModal").classList.remove("show");
    const existing = Object.values(chats).find(c => c.type === "private" && c.members.some(m => m.username === username));
    if (existing) openChat(existing.id);
    else socket.emit("createChat", { members: [username] });
  };
  $("userModal").classList.add("show");
}

/* ------- chat info ------- */
$("infoBtn").onclick = () => {
  const c = chats[activeChatId]; if (!c) return;
  $("infoTitle").textContent = c.name;
  let html = "";
  if (c.type === "group") {
    html += `<div class="muted" style="margin-bottom:10px">${c.members.length} участников</div>`;
    html += `<div class="members-list" id="infoMembers"></div>`;
    html += `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" id="addMembersBtn" type="button">＋ Добавить</button>
      ${c.createdBy === me.username ? '<button class="btn ghost" id="renameBtn" type="button">✎ Переименовать</button>' : ""}
      <button class="btn ghost" id="leaveBtn" type="button" style="color:#ff8494">Покинуть</button>
    </div>`;
  } else {
    const other = (c.members || []).find(m => m.username !== me.username);
    html += `<div class="muted" style="margin-bottom:10px">@${esc(other?.username || "")}</div>`;
    if (other?.bio) html += `<div class="user-card-bio">${esc(other.bio)}</div>`;
  }
  $("infoBody").innerHTML = html;
  if (c.type === "group") {
    const box = $("infoMembers");
    c.members.forEach(m => {
      const chip = document.createElement("div");
      chip.className = "chip"; chip.style.cursor = "pointer";
      chip.innerHTML = `<img src="${esc(m.avatar || "/bird.jpg")}">${esc(m.displayName || m.username)}` +
        (m.username !== me.username && c.createdBy === me.username ? '<button type="button" title="Удалить">✕</button>' : "");
      chip.onclick = e => { if (e.target.tagName === "BUTTON") return; $("infoModal").classList.remove("show"); showUserProfile(m.username); };
      if (m.username !== me.username && c.createdBy === me.username) {
        chip.querySelector("button").onclick = e => {
          e.stopPropagation();
          if (confirm("Удалить участника?")) { socket.emit("removeMember", { chatId: c.id, username: m.username }); $("infoModal").classList.remove("show"); }
        };
      }
      box.appendChild(chip);
    });
    $("addMembersBtn").onclick = () => { $("infoModal").classList.remove("show"); openNewChat("add"); };
    if ($("renameBtn")) $("renameBtn").onclick = () => {
      const nn = prompt("Новое название:", c.name);
      if (nn && nn.trim()) socket.emit("updateGroup", { chatId: c.id, name: nn.trim() });
    };
    $("leaveBtn").onclick = () => { if (confirm("Покинуть группу?")) { socket.emit("leaveChat", c.id); $("infoModal").classList.remove("show"); } };
  }
  $("infoModal").classList.add("show");
};

/* ------- forward ------- */
function showForward(m) {
  const box = $("forwardList");
  box.innerHTML = "";
  const list = Object.values(chats).sort((a, b) => {
    const ta = a.lastMessage ? a.lastMessage.time : a.createdAt || 0;
    const tb = b.lastMessage ? b.lastMessage.time : b.createdAt || 0;
    return tb - ta;
  });
  if (!list.length) box.innerHTML = '<div class="sb-empty">Нет чатов</div>';
  list.forEach(c => {
    const d = document.createElement("div");
    d.className = "user-pick";
    d.innerHTML = `<img src="${esc(c.avatar || "/bird.jpg")}"><div class="u"><b>${esc(c.name)}</b><span>${c.type === "group" ? "группа" : "личный чат"}</span></div>`;
    d.onclick = () => {
      const base = { chatId: c.id, replyTo: null, forwarded: true };
      if (m.type === "text") socket.emit("sendMessage", { ...base, text: m.text });
      else socket.emit("sendMedia", { ...base, url: m.url, type: m.type, name: m.name, size: m.size, mime: m.mime, caption: m.text });
      $("forwardModal").classList.remove("show");
      toast("Переслано в " + c.name);
    };
    box.appendChild(d);
  });
  $("forwardModal").classList.add("show");
}

/* =========================================================
   CALLS
   ========================================================= */
function startCall(kind) {
  if (!activeChatId) return;
  const c = chats[activeChatId];
  if (c.type !== "private") { toast("Звонки только в личных чатах"); return; }
  const other = c.members.find(m => m.username !== me.username);
  if (!other) return;
  if (!onlineSet.has(other.username)) { toast((other.displayName || other.username) + " не в сети"); return; }
  socket.emit("call:invite", { to: other.username, kind });
  toast("Звонок отправлен");
}
$("audioCallBtn").onclick = () => startCall("audio");
$("videoCallBtn").onclick = () => startCall("video");

/* =========================================================
   VIEWER
   ========================================================= */
document.addEventListener("click", e => {
  const media = e.target.closest(".msg-media");
  if (media && !e.target.closest("a")) {
    const v = $("viewer");
    const url = media.src;
    const isVideo = media.tagName === "VIDEO";
    const inner = isVideo
      ? `<video src="${url}" controls autoplay playsinline></video>`
      : `<img src="${url}" alt="">`;
    v.innerHTML = `<div class="viewer-tools">
        <button type="button" data-act="download">⬇ Скачать</button>
        <button type="button" data-act="close">✕</button>
      </div>${inner}`;
    v.classList.add("show");
    v.querySelector('[data-act="close"]').onclick = () => { v.classList.remove("show"); v.innerHTML = ""; };
    v.querySelector('[data-act="download"]').onclick = () => {
      const a = document.createElement("a");
      a.href = url; a.download = ""; a.target = "_blank";
      document.body.appendChild(a); a.click(); a.remove();
    };
  } else if (e.target.id === "viewer") {
    $("viewer").classList.remove("show");
    $("viewer").innerHTML = "";
  }
});

/* =========================================================
   INIT
   ========================================================= */
setAuthMode("login");
autoGrow();
if (token) startApp();

/* prevent iOS rubber-band on body but allow scroll in scrollable areas */
document.addEventListener("touchmove", e => {
  if (e.target.closest(".messages,.chat-list,.card,[style*='overflow'],.emoji-grid,.emoji-tabs")) return;
  if (e.target.closest("input,textarea")) return;
  e.preventDefault();
}, { passive: false });
</script>
