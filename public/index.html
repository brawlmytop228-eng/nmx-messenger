<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMX Messenger</title>
<style>
:root{--bg:#09111f;--p:#111c2e;--p2:#18263d;--line:#293850;--text:#f8fafc;--muted:#91a0b8;--blue:#2f6df6;--bubble:#263852}
*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,Arial}
button,input{font:inherit}button{cursor:pointer}#login{height:100%;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:var(--p);border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center}.logo{width:105px;height:105px;border-radius:30px;object-fit:cover}.card h1{margin:12px 0 5px}.muted{color:var(--muted);margin-bottom:22px}.row{display:flex;gap:8px}.row input,.search,.composer input{background:#0a1424;border:1px solid var(--line);color:var(--text);outline:0;border-radius:14px;padding:13px}.row input{flex:1}.primary,.send{border:0;background:var(--blue);color:white;border-radius:14px;padding:12px 18px;font-weight:700}
#app{display:none;height:100%;grid-template-columns:310px 1fr}.side{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column}.head,.chathead{height:70px;padding:10px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.sideLogo,.avatar{width:44px;height:44px;border-radius:13px;object-fit:cover}.brand{font-weight:800;font-size:19px;flex:1}.icon{background:transparent;border:0;color:var(--text);font-size:20px;padding:8px;border-radius:10px}.search{margin:12px;width:calc(100% - 24px)}.users{overflow:auto;padding:0 8px}.user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px}.user.active,.user:hover{background:var(--p2)}.user img{width:45px;height:45px;border-radius:50%;object-fit:cover}.uinfo{flex:1;min-width:0}.uname{font-weight:700;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;background:#22c55e;border-radius:50%}.me{margin-top:auto;padding:11px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}.me img{width:38px;height:38px;border-radius:50%;object-fit:cover}.me b{flex:1}
.chat{min-width:0;display:flex;flex-direction:column}.chathead img{width:44px;height:44px;border-radius:50%;object-fit:cover}.chatname{flex:1}.chatname b{display:block}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.empty{margin:auto;text-align:center;color:var(--muted)}.empty img{width:90px;height:90px;border-radius:25px;object-fit:cover}.msg{max-width:78%;padding:10px 13px;background:var(--bubble);border-radius:17px;align-self:flex-start;word-break:break-word}.mine{align-self:flex-end;background:var(--blue)}.meta{font-size:10px;opacity:.6;text-align:right;margin-top:4px}.reply{font-size:12px;opacity:.7;border-left:3px solid #9bb8ff;padding-left:7px;margin-bottom:6px}.typing{height:20px;padding:0 18px;color:var(--muted);font-size:12px}.composer{display:flex;gap:8px;padding:10px;background:var(--p);border-top:1px solid var(--line)}.composer input{flex:1;min-width:0}.send{font-size:20px}.emoji{border:0;background:var(--p2);color:white;border-radius:14px;padding:0 13px}.back{display:none}
@media(max-width:700px){#app{grid-template-columns:1fr}.chat{display:none}.chat.show{display:flex}.side.hide{display:none}.back{display:block}}
</style></head><body>
<section id="login"><div class="card"><img class="logo" src="/bird.jpg"><h1>NMX Messenger</h1><div class="muted">Чаты • онлайн • поиск • ответы • уведомления</div><div class="row"><input id="name" maxlength="24" placeholder="Твоё имя"><button class="primary" id="loginBtn">Войти</button></div></div></section>
<section id="app"><aside class="side" id="side"><div class="head"><img class="sideLogo" src="/bird.jpg"><div class="brand">NMX Messenger</div><button class="icon" id="logout">↪</button></div><input class="search" id="search" placeholder="🔎 Поиск людей"><div class="users" id="users"></div><div class="me"><img src="/bird.jpg"><b id="my"></b></div></aside>
<main class="chat" id="chat"><div class="chathead"><button class="icon back" id="back">‹</button><img id="ca" src="/bird.jpg"><div class="chatname"><b id="cn">Выберите чат</b><span class="status" id="cs">—</span></div><button class="icon" id="notify">🔔</button></div><div class="messages" id="msgs"><div class="empty"><img src="/bird.jpg"><p>Выбери человека и начинай общение 👋</p></div></div><div class="typing" id="typing"></div><form class="composer" id="form"><button type="button" class="emoji" id="emoji">😊</button><input id="text" disabled maxlength="2000" placeholder="Написать сообщение..."><button class="send" disabled id="send">➤</button></form></main></section>
<script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),s=io();let me=null,users=[],online=[],msgs=[],active=null,reply=null,tt;
const esc=x=>{let d=document.createElement("div");d.textContent=x;return d.innerHTML}, tm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),pair=(a,b)=>[a,b].sort().join("|");
function drawUsers(){let q=$("search").value.toLowerCase();$("users").innerHTML="";users.filter(u=>u.username!==me.username&&u.username.toLowerCase().includes(q)).forEach(u=>{let d=document.createElement("div");d.className="user "+(active===u.username?"active":"");d.innerHTML=`<img src="/bird.jpg"><div class="uinfo"><div class="uname">${esc(u.username)}</div><div class="status">${online.includes(u.username)?"🟢 онлайн":"не в сети"}</div></div>${online.includes(u.username)?"<span class=dot></span>":""}`;d.onclick=()=>open(u.username);$("users").append(d)})}
function open(name){active=name;$("cn").textContent=name;$("cs").textContent=online.includes(name)?"🟢 онлайн":"не в сети";$("text").disabled=$("send").disabled=false;$("msgs").innerHTML="";let a=msgs.filter(m=>pair(m.from,m.to)===pair(me.username,name));if(!a.length)$("msgs").innerHTML='<div class="empty"><img src="/bird.jpg"><p>Пока сообщений нет.<br>Напиши первым 👋</p></div>';a.forEach(render);drawUsers();$("side").classList.add("hide");$("chat").classList.add("show");$("text").focus()}
function render(m){let d=document.createElement("div");d.className="msg "+(m.from===me.username?"mine":"");d.dataset.id=m.id;let r=m.replyTo?msgs.find(x=>x.id===m.replyTo):null;d.innerHTML=(r?`<div class=reply>${esc(r.from)}: ${esc(r.text.slice(0,70))}</div>`:"")+`<div>${esc(m.text)}</div><div class=meta>${tm(m.time)}</div>`;d.onclick=()=>{if(m.from===me.username&&confirm("Удалить сообщение?"))s.emit("deleteMessage",m.id);else{reply=m;$("text").placeholder="Ответить…";$("text").focus()}};$("msgs").append(d);$("msgs").scrollTop=$("msgs").scrollHeight}
function login(){let n=$("name").value.trim();if(n)s.emit("login",n)}$("loginBtn").onclick=login;$("name").onkeydown=e=>e.key==="Enter"&&login();let saved=localStorage.getItem("nmx_name");if(saved)$("name").value=saved;
s.on("init",d=>{me=d.me;users=d.users;msgs=d.messages;online=d.online||[];localStorage.setItem("nmx_name",me.username);$("login").style.display="none";$("app").style.display="grid";$("my").textContent=me.username;drawUsers()});
s.on("presence",p=>{online=p;drawUsers();if(active)$("cs").textContent=online.includes(active)?"🟢 онлайн":"не в сети"});s.on("userList",u=>{users=u;drawUsers()});
s.on("privateMessage",m=>{msgs.push(m);if(active&&pair(m.from,m.to)===pair(me.username,active))render(m);else if(m.to===me.username&&"Notification"in window&&Notification.permission==="granted")new Notification("NMX Messenger",{body:m.from+": "+m.text})});
s.on("messageDeleted",id=>{msgs=msgs.filter(m=>m.id!==id);document.querySelector(`[data-id="${id}"]`)?.remove()});s.on("typing",d=>{if(active===d.from)$("typing").textContent=d.active?d.from+" печатает…":""});
$("form").onsubmit=e=>{e.preventDefault();let t=$("text").value.trim();if(!t||!active)return;s.emit("privateMessage",{to:active,text:t,replyTo:reply?.id||null});$("text").value="";reply=null;$("text").placeholder="Написать сообщение..."};
$("text").oninput=()=>{if(!active)return;s.emit("typing",{to:active,active:true});clearTimeout(tt);tt=setTimeout(()=>s.emit("typing",{to:active,active:false}),700)};
$("search").oninput=drawUsers;$("emoji").onclick=()=>{$("text").value+=($("text").value?" ":"")+"😀";$("text").focus()};$("back").onclick=()=>{$("side").classList.remove("hide");$("chat").classList.remove("show");active=null};$("logout").onclick=()=>{localStorage.removeItem("nmx_name");location.reload()};$("notify").onclick=()=>{"Notification"in window&&Notification.requestPermission()};
</script></body></html>
